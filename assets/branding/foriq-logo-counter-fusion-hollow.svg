<!--
  Hollow variant for visual comparison.
  o, q (Foriq) and O, R (COUNTER) are real donut paths
  (outer + inner in one path with fill-rule="evenodd").
  Note: r-arc is an open arc (not a ring) and stays a filled stroke.
-->
