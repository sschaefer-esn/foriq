; ── Foriq firmware — build target ──
;
;   m5sticks3 → M5Stick S3 (ESP32-S3, BMI270)
;
; The server address is set at runtime (setup portal or USB);
; the default is the local Foriq app at http://foriq.local:8420.
;
; Debug build: append -DFORIQ_DEBUG=1 to build_flags locally (see config.h).
;
; Versions are pinned so a fresh machine builds the same image: platform 6.13.0
; ships Arduino-ESP32 2.0.17. Newer platform majors (7.x/8.x) are a separate,
; hardware-tested migration, not a routine update.

[env:m5sticks3]
platform = espressif32 @ 6.13.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNDEBUG
    -DFIRMWARE_TARGET=\"m5sticks3\"
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts =
    pre:read_version.py
    post:tools/check_firmware_size.py
